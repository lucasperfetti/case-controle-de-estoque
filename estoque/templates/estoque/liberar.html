
{% extends 'estoque/base.html' %}

{% block title %}Liberar operação{% endblock %}

{% block content %}

<h2 class="mb-4">Liberar reserva ou bloqueio</h2>

<div class="card shadow-sm">
    <div class="card-body">

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-success">
                Liberar quantidade
            </button>

        </form>

    </div>
</div>

{% endblock %}
