
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Controle de Estoque{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}">
            Controle de Estoque
        </a>
    </div>
</nav>

<div class="container mt-4">

    <div class="row">

        <aside class="col-md-3 mb-4">
            <div class="list-group">

                <a href="{% url 'dashboard' %}"
                   class="list-group-item list-group-item-action">
                    Dashboard
                </a>

                <a href="{% url 'produtos' %}"
                   class="list-group-item list-group-item-action">
                    Produtos
                </a>

                <a href="{% url 'cadastrar_produto' %}"
                   class="list-group-item list-group-item-action">
                    Cadastrar produto
                </a>

                <a href="{% url 'operacao' 'ENTRADA' %}"
                   class="list-group-item list-group-item-action">
                    Entrada
                </a>

                <a href="{% url 'operacao' 'SAIDA' %}"
                   class="list-group-item list-group-item-action">
                    Saída
                </a>

                <a href="{% url 'operacao' 'RESERVA' %}"
                   class="list-group-item list-group-item-action">
                    Reservar
                </a>

                <a href="{% url 'operacao' 'BLOQUEIO' %}"
                   class="list-group-item list-group-item-action">
                    Bloquear
                </a>

                <a href="{% url 'liberar' %}"
                   class="list-group-item list-group-item-action">
                    Liberar
                </a>

                <a href="{% url 'consultar' %}"
                   class="list-group-item list-group-item-action">
                    Consultar
                </a>

            </div>
        </aside>

        <main class="col-md-9">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            {% block content %}
            {% endblock %}

        </main>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
